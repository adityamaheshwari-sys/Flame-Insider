<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Inside Flame</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#fff8f1;--fg:#2b1d14;--card:#fff;--ac:#d9480f;--mu:#7a6a5e;--bd:#ecd9c8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1410;--fg:#f5e9de;--card:#2a1f18;--ac:#ff8a4c;--mu:#b9a798;--bd:#43332a}}
:root[data-theme="dark"]{--bg:#1c1410;--fg:#f5e9de;--card:#2a1f18;--ac:#ff8a4c;--mu:#b9a798;--bd:#43332a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
header{padding:20px 16px 8px;max-width:760px;margin:auto}h1{margin:0;font-size:1.8rem;color:var(--ac)}header p{margin:2px 0;color:var(--mu)}
nav{display:flex;gap:6px;overflow-x:auto;max-width:760px;margin:auto;padding:8px 16px}
nav button,.b{border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:8px 14px;border-radius:20px;cursor:pointer;white-space:nowrap;font:inherit}
nav button.on,.b.p{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:760px;margin:auto;padding:8px 16px 40px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin:8px 0}
.li{display:flex;justify-content:space-between;cursor:pointer}.mu{color:var(--mu);font-size:.85rem}
input,textarea,select{width:100%;box-sizing:border-box;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);font:inherit;margin:4px 0}
.r{display:flex;align-items:center;gap:8px;justify-content:space-between}.r select{width:auto}
.m{display:flex;justify-content:space-between;font-size:.9rem;border-bottom:1px dashed var(--bd);padding:2px 0}
</style></head><body>
<header><h1>🔥 Inside Flame</h1><p>Cafes, courses, professors &amp; advice, by FLAME students for FLAME students.</p></header>
<nav id="nav"></nav><main id="app"></main>
<script>

const CAFES={

nagement|Introduction to Philosophy|Introduction to Physics|Introduction to Print Making|Introduction to Programming|Introduction to Psychology|Introduction to Public Policy and Public Administration|Introduction to Quantitative Methods in Psychology|Introduction to Quantitative Reasoning|Introduction to Sculpture|Introduction to Sociology|Introduction to Spreadsheet Modeling|Introduction to Western Music|Introduction to Western Philosophy|Introductory Calculus|Learning by Doing|Mahabharata|Materials and Processes|Modern Indian Political History|Performance Cultures|Poetry: From Sonnets to Slam Poetry|Precalculus|Principles of Economics|Principles of Management|Principles of Music|Public Speaking|Python Programming for Computing and Data Sciences|Quantitative Methods in Economics|Rhythm Studies|Screen Printing|Sculpture: Explorations in Materials|Social Media Influencers and Journalism|Social Welfare and Legislation|Sociology of Gender|The Climate Crisis: A Citizen's Guide to Global Warming|The Microbial World|Thinking Like an Economist|Visual story telling for Film and Television|Why Art matters|World Literature|World Regional Geography");
const PROFS=T("Aakash Kamble|Aamod Sane|Abha Basargekar|Abhay Doshi|Abhijit Mazumdar|Abhineety Goel|Abhishek Kumar|Abhishek Sahai|Abdul Khalid Sheikh|Aditi Joshi|Aditya Nain|Ajay Manrai|Akashdeep Roy|Amarpreet Singh Ghura|Amit Anurag|Amit Inamdar|Amit Jena|Amit Kumar Das|Amit Kundal|Amith Vikram Megaravalli|Andrea Phillott|Aniruddha Pant|Anjal Prakash|Anjali Mishra|Ankur Kushwaha|Anubrata Deka|Anuradha Batabyal|Anwesha Basu|Aparna Shankar|Arnab Chakrabarti|Arun Kaushik|Ashish Goyal|Ashutosh Potdar|Ashwini Giri|Atul Joshi|Avani Chaturvedi|Avani Sabade|Barun Kumar Thakur|Bharat Damani|Bhavya Pande|Bilwa Deshpande|Chaitanya Ravi|Chetna Monga|Chiraandjoy Chattopadhyay|Chitra Dandawate|Damini Goyal Gupta|Darshan Doshi|Debasis Rooj|Debraj Bhattacharjee|Deepa Bapat|Devi Singh|Dhanmajiri Sathe|Dhruva Teja Nandipati|Dishan Kamdar|Dishant Pradhan|Divya Balan|Erik Stolterman|Faizul Haque|Gangaraju Saladi|Ganeshdatta Poddar|Garima Rajan|Gaurav Gadgil|Gaurav Pai|Gayathri Sivakumar|Gayatri Kotbagi|Gitesh Chavan|Harsh Vasani|Hoshiar Mal|Hyokjin Kwak|Jaslene Bawa|Jayant Pande|Jayaraman Krishnamoorthy Valadi|Joyita Roy Chowdhury|Juhi Sidharth|K S Mochish|Karan Talathi|Kaushik Gopalan|Kaushik Ramu|Kedar Kulkarni|Ketoki Mazumdar|Khyati Jagani|Krishna Veer Tiwari|Kunal Ray|Kunal Sarpal|Lily Kelting|Ling-Ling Wu|Lokendra Vishwakarma|M.A. Venkataramanan|Mahdi Soleimani Farrokh|Malati Rao|Manasi Anand|Manasvi Sharma|Manjula Srinivas|Manoj Kumar Panda|Manoranjan Dash|Maya Dodd|Mayank Loonker|Mayurakshi Chaudhuri|Melody Kshetrimayum|Michael Burns|Michael Hatcher|Mihir Hasabnis|Milind Sathye|Moitrayee Das|Moulika Mandal|Muhammad Vasil M|Muhammed Suhail PS|Murari Srinivasa|Naman Dubey|Nandima Angom|Neelakantan Jayasankar|Neeta Sharma|Neethu Mohammed|Neelima Shukla-Bhatt|Neha Bailwal|Neha Yadav|Nidhi Kalra|Ninad Patwardhan|Nitin Sanghavi|Pallavi Ramanathan|Pankaj Jain|Parth Salunke|Pathik Desai|Pawel Atroszko|Poonam Gandhi|Prajish Prasad|Pranav Ambardekar|Prasad Pathak|Preetha Menon|Priya Joshi|Purnima Bajre|R S Desikan|Ragini Mohite|Rahul Chopra|Rahul Goswami|Rahul Kumar Ray|Rajeev K Goel|Rajeev Kumar Revulagadda|Rajitha Venugopal|Ramna Walia|Raunaq Pungaliya|Ravi Bhavnani|Ravikiran Naik|Renu Dhadwal|Reshmi Sengupta|Rishi Jha|Rituparna Kaushik|Riyaz Latif|Rohit Tiwari|Rupa Korde|Ruzbeh Bodhanwala|S V Subramanian|Sairaj Patki|Sajith Narayanan|Sameer Dublay|Sandeep Khanna|Sandip Roy|Sanjay Bakshi|Sanjal Shastri|Santosh Kumar Kudtarkar|Sasikiran R M|Saswata Guha Thakurata|Saurabh Madaan|Seema Potluri|Shalaka Shah|Shamit Shrivastav|Shamsher Singh|Sheeva Dubey|Sherline Pimenta|Shernaz Bodhanwala|Shikha Gupta|Shikha Sharma|Shilpa Shinde|Shivakumar Jolad|Shiwani Singh|Shree Vallabha|Shreya Mukherjee|Shruti Goyal|Shweta Rana|Sigma Soni|Sitaram Soni|Smita Chaudhry|Snehal Shekatkar|Sougato Das|Soumitra Kemkar|Soumodip Sarkar|Srinivasan Murali|Sucharita Belavadi|Sujay Joshi|Sujeet Savargaonkar|Sujit Shedage|Sunil Poshakwale|Sunil Rajpal|Suniti Vadalkar|Surbhi Choudhary|Swapnajit Chakraborti|Swapnil Tawde|Swayamsiddha Panigrahi|Tanavi Jagdale|Tanuj Negi|Tarinee Awasthi|Tushar Rajput|Utpal Tatu|Vahideh Razmi|Vamsi Krishna Gunturu|Vikash Pandey|Vinit Ghosh|Vinod Kumar|Vinod Vidwans|Vinutha Mallya|Viraj Shah|Vishal Choudhury|Vishal Khandelwal|Vishal R. Shah|Yamini Krishna|Yashika Shukla|Yashobanta Parida");
const TABS={
cafes:{n:"Cafes",items:Object.keys(CAFES),crit:["Food","Value for money","Service"]},
courses:{n:"Courses",items:COURSES,crit:["Difficulty","Future use"]},
profs:{n:"Professors",items:PROFS,crit:["Strictness","Communication","Teaching ability"]},
advice:{n:"General Advice"}};
let tab="cafes",sel=null,q="",S={};
try{S=JSON.parse(localStorage.getItem("flame")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("flame",JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const get=k=>S[k]||(S[k]={r:[],c:[]});
const avg=(k,i)=>{const r=get(k).r;return r.length?(r.reduce((a,x)=>a+x[i],0)/r.length).toFixed(1):"–"};
function nav(){document.getElementById("nav").innerHTML=Object.entries(TABS).map(([k,v])=>`<button class="${k==tab?"on":""}" onclick="tab='${k}';sel=null;q='';draw()">${v.n}</button>`).join("")}
function comments(k){return `<h3>Comments</h3>`+(get(k).c.map(c=>`<div class="c"><b>${esc(c[0]||"Anonymous")}</b><br>${esc(c[1])}</div>`).join("")||`<p class="mu">No comments yet.</p>`)+
`<input id="nm" placeholder="Your name (optional)"><textarea id="tx" rows="3" placeholder="Write a comment…"></textarea><button class="b p" onclick="addC('${k}')">Post comment</button>`}
function addC(k){const t=document.getElementById("tx").value.trim();if(!t)return;get(k).c.push([document.getElementById("nm").value.trim(),t]);save();draw()}
function addR(k,n){get(k).r.push(Array.from({length:n},(_,i)=>+document.getElementById("rt"+i).value));save();draw()}
function detail(){const t=TABS[tab],k=tab+":"+sel;let h=`<button class="b" onclick="sel=null;draw()">← Back</button><h2>${esc(sel)}</h2>`;
if(tab=="cafes")h+=`<div class="c">`+CAFES[sel].split(";").map(g=>{const[c,i]=g.split(":");return `<b>${c}</b>`+i.split(",").map(x=>{const p=x.lastIndexOf(" ");return `<div class="m"><span>${esc(x.slice(0,p))}</span><span>₹${x.slice(p+1)}</span></div>`}).join("")}).join("<br>")+`<p class="mu">Highlights shown; ask at the counter for the full menu.</p></div>`;
h+=`<div class="c"><b>Ratings</b> <span class="mu">(${get(k).r.length} so far)</span>`+t.crit.map((c,i)=>`<div class="r"><span>${c}</span><span>avg ${avg(k,i)} / 5 &nbsp; <select id="rt${i}">${[1,2,3,4,5].map(n=>`<option ${n==3?"selected":""}>${n}</option>`).join("")}</select></span></div>`).join("")+`<button class="b p" onclick="addR('${k}',${t.crit.length})">Submit my rating</button></div>`+comments(k);return h}
function list(){const t=TABS[tab],f=t.items.filter(x=>x.toLowerCase().includes(q.toLowerCase()));
return `<input id="q" placeholder="Search ${t.n.toLowerCase()}…" value="${esc(q)}" oninput="q=this.value;draw(1)">`+f.map(x=>{const k=tab+":"+x,n=get(k).r.length;return `<div class="c li" onclick="sel=this.dataset.n;draw()" data-n="${esc(x)}"><span>${esc(x)}</span><span class="mu">${n?n+" rating"+(n>1?"s":""):"Not rated"}</span></div>`}).join("")||`<p class="mu">No matches.</p>`}
function advice(){return `<h2>General Advice</h2><p class="mu">Seniors: leave tips for the juniors.</p>`+(get("advice").c.map(c=>`<div class="c"><b>${esc(c[0]||"A senior")}</b><br>${esc(c[1])}</div>`).join("")||`<p class="mu">No advice yet. Be the first!</p>`)+`<input id="nm" placeholder="Your name (optional)"><textarea id="tx" rows="4" placeholder="Share your advice…"></textarea><button class="b p" onclick="addC('advice')">Post advice</button>`}
function draw(keep){nav();const a=document.getElementById("app");a.innerHTML=tab=="advice"?advice():sel?detail():list();if(keep){const e=document.getElementById("q");e.focus();e.setSelectionRange(q.length,q.length)}}
draw();
</script></body></html>
